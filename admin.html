<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>종합게임 API 관리자</title><style>
body{margin:0;font-family:Arial,"Noto Sans KR",sans-serif;background:#f4fbff;color:#17364a}.wrap{max-width:1180px;margin:30px auto;padding:0 18px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.card{background:white;border:1px solid #cbe5f3;border-radius:18px;padding:18px;margin-top:14px;box-shadow:0 8px 25px rgba(39,111,151,.08)}h1{margin:0;font-size:25px}input,textarea,button{font:inherit;border:1px solid #b8d9ea;border-radius:10px;padding:10px;box-sizing:border-box}button{background:#168bc3;color:#fff;font-weight:800;cursor:pointer}.login{display:flex;gap:8px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{padding:16px;border-radius:14px;background:#eef9ff}.stat b{display:block;font-size:28px}.users{display:grid;gap:8px}.user{display:grid;grid-template-columns:42px 1fr auto;gap:10px;align-items:center;padding:10px;border:1px solid #d7eaf4;border-radius:12px}.user img{width:42px;height:42px;border-radius:50%;object-fit:cover;background:#e7f5fb}.user small{color:#648397}.updateGrid{display:grid;grid-template-columns:160px 1fr;gap:9px}.updateGrid textarea,.updateGrid input{width:100%}@media(max-width:700px){.stats{grid-template-columns:1fr}.updateGrid{grid-template-columns:1fr}.user{grid-template-columns:42px 1fr}.user>span:last-child{grid-column:2}}</style>
<style id="v14-admin-design">
body{background:linear-gradient(145deg,#c9edf5,#edfafd 48%,#c4e6ef)!important;color:#173e52!important}.wrap{max-width:1260px!important}.card{background:rgba(250,254,255,.95)!important;border-color:#b6dce7!important;box-shadow:0 16px 42px rgba(47,112,139,.10)!important}.stat{background:linear-gradient(145deg,#edfafd,#fff)!important;border:1px solid #c0e1ea}.user{background:#fff!important;border-color:#c4e1e9!important}.adminHero{padding:16px 18px;border-radius:18px;background:linear-gradient(110deg,#124052,#1b6780);color:#f7fdff;box-shadow:0 14px 35px #174f661e}.adminHero small{color:#c7e8f2}.apiBadge{display:inline-block;padding:4px 7px;border-radius:999px;font-size:10px;font-weight:900;background:#eef4f6;color:#6e8792}.apiBadge.on{background:#e6fbf1;color:#287159}.verified{color:#248568;font-weight:900}.user small{line-height:1.5}
</style>
</head><body><div class="wrap"><div class="adminHero"><b>👑 김멘탈 전용 관리자</b><small> 관리자 키 없이는 접속 현황을 조회할 수 없습니다.</small></div><div class="top"><div><h1>종합게임 API 관리자</h1><div>현재 접속 · 개인별 실행 게임 · API 상태 · 안전한 업데이트</div></div><div class="login"><input id="key" type="password" placeholder="관리자 키"><button id="load">불러오기</button></div></div>
<div class="card"><div class="stats"><div class="stat">현재 온라인<b id="online">-</b></div><div class="stat">열린 방<b id="rooms">-</b></div><div class="stat">최신 버전<b id="latest">-</b></div></div></div>
<div class="card"><h3>현재 사용 중</h3><div id="users" class="users">관리자 키를 입력해 주세요.</div></div>
<div class="card"><h3>업데이트 공지 설정</h3><div class="updateGrid"><label>최신 버전</label><input id="ver" value="1.0.0"><label>공지 문구</label><textarea id="notice" rows="3" placeholder="현재 콘텐츠를 마친 뒤 업데이트해 주세요."></textarea><label>다운로드 주소</label><input id="url" placeholder="https://..."></div><p style="color:#648397;font-size:12px">사용 중인 프로그램을 강제로 종료하지 않습니다. 새 버전은 화면 상단에 안내만 표시됩니다.</p><button id="save">업데이트 공지 저장</button> <span id="msg"></span></div>
</div><script>
const API=location.origin;const $=id=>document.getElementById(id);let timer=null;function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}function ago(ms){const s=Math.max(0,Math.round((Date.now()-ms)/1000));return s<60?s+'초 전':Math.floor(s/60)+'분 전'}async function status(){const k=$('key').value.trim();if(!k)return;const r=await fetch(API+'/api/admin/status?key='+encodeURIComponent(k),{cache:'no-store'});const d=await r.json();if(!d.ok)throw Error(d.message||'실패');$('online').textContent=d.online+'명';$('rooms').textContent=d.rooms.length+'개';$('latest').textContent=d.update.latestVersion||'-';$('ver').value=d.update.latestVersion||'1.0.0';$('notice').value=d.update.notice||'';$('url').value=d.update.downloadUrl||'';$('users').innerHTML=d.users.length?d.users.map(u=>`<div class="user"><img src="${u.img||''}"><span><b>${esc(u.name||u.id)}</b><small>${esc(u.id)} · 🎮 ${esc(u.activeGame||u.content||'lobby')} · ${esc(u.room?('방 '+u.room):'방 없음')} · v${esc(u.version||'?')}<br>${u.streamerVerified?'<span class=verified>✓ 스트리머 인증</span>':'스트리머 인증 대기'} · <span class="apiBadge ${u.apiConnected?'on':''}">${u.apiConnected?'🎈 API 연결':'API 대기'}</span>${Number(u.lastApiEvent||0)>0?' · 마지막 API '+ago(Number(u.lastApiEvent)):''}</small></span><span>${ago(Number(u.lastSeen||0))}</span></div>`).join(''):'현재 사용자가 없습니다.'}
$('load').onclick=()=>{status().then(()=>{clearInterval(timer);timer=setInterval(()=>status().catch(()=>{}),10000)}).catch(e=>alert(e.message))};$('save').onclick=async()=>{const p=new URLSearchParams({key:$('key').value.trim(),latestVersion:$('ver').value.trim(),notice:$('notice').value.trim(),downloadUrl:$('url').value.trim()});const r=await fetch(API+'/api/admin/update',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:p});const d=await r.json();$('msg').textContent=d.ok?'저장됨':'실패: '+d.message;if(d.ok)status()};</script></body></html>
