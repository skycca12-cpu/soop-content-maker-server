function guideEsc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function ensureGuideUI(){
 if(document.getElementById('gameGuideBackdrop'))return;
 const wrap=document.createElement('div');wrap.id='gameGuideBackdrop';wrap.className='guide-backdrop';wrap.innerHTML='<div class="guide-modal" role="dialog" aria-modal="true"><div class="guide-head"><h2 id="gameGuideTitle">사용법</h2><button class="guide-close" id="gameGuideClose" aria-label="닫기">×</button></div><div class="guide-body" id="gameGuideBody"></div></div>';
 document.body.appendChild(wrap);document.getElementById('gameGuideClose').onclick=closeGameGuide;wrap.onclick=e=>{if(e.target===wrap)closeGameGuide()};document.addEventListener('keydown',e=>{if(e.key==='Escape')closeGameGuide()});
}
function openGameGuide(id){ensureGuideUI();const g=GAME_GUIDES[id];if(!g)return;document.getElementById('gameGuideTitle').textContent=g.title;document.getElementById('gameGuideBody').innerHTML=`<div class=guide-intro>${guideEsc(g.intro)}</div><div class=guide-steps>${g.steps.map((x,i)=>`<div class=guide-step><span class=guide-num>${i+1}</span><div><b>${guideEsc(x[0])}</b><p>${guideEsc(x[1])}</p></div></div>`).join('')}</div><div class=guide-api><b>🎈 SOOP API 예시</b><br>${guideEsc(g.api)}</div><div class=guide-tip><b>💡 사용 팁</b><br>${guideEsc(g.tip)}</div>`;document.getElementById('gameGuideBackdrop').classList.add('on')}
function closeGameGuide(){const x=document.getElementById('gameGuideBackdrop');if(x)x.classList.remove('on')}
function addGuideButton(panel,id){const b=document.createElement('button');b.type='button';b.className='game-guide-btn';b.innerHTML='❔ 사용법';b.onclick=()=>openGameGuide(id);panel.appendChild(b)}

const tabs=document.getElementById('tabs'),main=document.getElementById('main');games.forEach(([id,l],i)=>{let b=document.createElement('button');b.textContent=l;b.dataset.id=id;if(!i)b.className='on';tabs.appendChild(b);let s=document.createElement('section');s.id=id;s.className='panel'+(!i?' on':'');main.appendChild(s);addGuideButton(s,id)});tabs.onclick=e=>{let b=e.target.closest('button');if(!b)return;document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b));document.querySelectorAll('.panel').forEach(x=>x.classList.toggle('on',x.id===b.dataset.id));ensureSocialStrip(document.getElementById(b.dataset.id))};
function switchGamePanel(id){
  document.querySelectorAll('#tabs button').forEach(x=>x.classList.toggle('on',x.dataset.id===id));
  document.querySelectorAll('main .panel').forEach(x=>x.classList.toggle('on',x.id===id));
  ensureSocialStrip(document.getElementById(id));
}

const pc=document.getElementById('pc'),ctx=pc.getContext('2d');
const WORLD_W=980,WORLD_H=4300,VIEW_H=1500;
let prBalls=[],prOb=[],prFinishOrder=[],prRunning=false,prRAF=0,prLast=0,prCamY=0,prWinnerAnnounced=false;

}

    localStorage.setItem('soop_pin_meta_v3',JSON.stringify({

    }));
  }catch(e){}
}


function prRnd(a,b){return a+Math.random()*(b-a)}
function prClamp(v,a,b){return Math.max(a,Math.min(b,v))}
function prHashColor(n){return `hsl(${(n*61)%360} 88% 60%)`}
function prEvent(t){prEventEl.textContent=t}
const prEventEl=document.getElementById('prEvent');

function parseParticipants(){
  const lines=prNames.value.split(/\n+/).map(x=>x.trim()).filter(Boolean);
  const out=[];
  for(const line of lines){
    let name=line,count=1;
    let m=line.match(/^(.*?)(?:\*(\d+)|(\d+))$/);
    if(m){name=(m[1]||'공').trim();count=+(m[2]||m[3]||1)}
    count=prClamp(count,1,30);
    for(let i=0;i<count;i++)out.push(name||'공');
  }
  return out.slice(0,120);
}
function spawnBall(name,x=prRnd(150,830),y=90){
  prBalls.push({id:prNextId++,name,x,y,vx:prRnd(-.7,.7),vy:prRnd(.2,1.0),r:12,done:false,finish:0,color:prHashColor(prNextId),skillCd:prRnd(80,180),trail:[]});
}
function buildMap(kind){
  prOb=[];
  // side walls are implicit. create long sections to make the run last.
  const add=(type,x,y,r=18,extra={})=>prOb.push({type,x,y,r,...extra});
  if(kind==='wheel'){
    for(let section=0;section<7;section++){
      const oy=320+section*545,mode=section%4;
      if(mode===0){for(let k=0;k<16;k++){let a=k/16*Math.PI*2,rad=145+(k%2)*34;add('peg',490+Math.cos(a)*rad,oy+Math.sin(a)*rad,15)}add('spinner',490,oy,78,{phase:Math.random()*6.28,speed:.018})}
      else if(mode===1){for(let row=0;row<4;row++)for(let col=0;col<7;col++)add('bubble',125+col*122+(row%2)*55,oy-135+row*85,18+(col%3)*3);add('bar',180,oy+190,0,{x2:430,y2:oy+255});add('bar',800,oy+190,0,{x2:550,y2:oy+255})}
      else if(mode===2){add('spinner',310,oy-30,62,{phase:.3,speed:-.023});add('spinner',670,oy+60,62,{phase:1.8,speed:.024});for(let k=0;k<9;k++)add('peg',120+k*92,oy+190+(k%2)*48,17)}
      else{for(let k=0;k<6;k++){add('peg',180+k*125,oy-160+k%2*60,20);add('peg',180+k*125,oy+105+(k+1)%2*60,20)}add('bar',150,oy+245,0,{x2:420,y2:oy+300});add('bar',830,oy+245,0,{x2:560,y2:oy+300})}
    }
  }else if(kind==='bubble'){
    for(let row=0;row<24;row++){
      const oy=270+row*155,offset=row%2?80:0;
      for(let col=0;col<6;col++){
        add('bubble',130+offset+col*145,oy,22+(row%3)*3);
      }
      if(row%5===2)add('spinner',490,oy+70,65,{phase:0,speed:row%2?.021:-.021});
    }
  }else{
    // jar: narrow/wide alternating funnels
    for(let section=0;section<8;section++){
      const oy=300+section*500;
      for(let i=0;i<9;i++){
        const x=120+i*92;
        add('peg',x,oy+(i%2)*55,17);
      }
      // gate blockers creating bottle necks
      add('bar',240,oy+220,0,{x2:430,y2:oy+300});
      add('bar',740,oy+220,0,{x2:550,y2:oy+300});
      add('peg',490,oy+340,34);
    }
  }
  // final gauntlet
  for(let row=0;row<5;row++){
    for(let col=0;col<7;col++) add('peg',105+col*128+(row%2)*40,3750+row*92,16);
  }
}
function collideCircle(b,o,power=1){
  const dx=b.x-o.x,dy=b.y-o.y,d=Math.hypot(dx,dy),rr=b.r+o.r;
  if(!d||d>=rr)return false;
  const nx=dx/d,ny=dy/d;
  const dot=b.vx*nx+b.vy*ny;
  if(dot<0){b.vx-=1.75*dot*nx;b.vy-=1.75*dot*ny}
  b.vx+=nx*power;b.vy+=ny*power;
  b.x=o.x+nx*rr;b.y=o.y+ny*rr;
  return true;
}
function collideSeg(b,x1,y1,x2,y2){
  const vx=x2-x1,vy=y2-y1,wx=b.x-x1,wy=b.y-y1;
  const t=prClamp((wx*vx+wy*vy)/(vx*vx+vy*vy),0,1),cx=x1+t*vx,cy=y1+t*vy;
  const dx=b.x-cx,dy=b.y-cy,d=Math.hypot(dx,dy);
  if(!d||d>b.r+5)return;
  const nx=dx/d,ny=dy/d,dot=b.vx*nx+b.vy*ny;
  if(dot<0){b.vx-=1.8*dot*nx;b.vy-=1.8*dot*ny;b.x+=nx*3;b.y+=ny*3}
}
function physics(ts,dt){
  const speed=+prSpeed.value||1,boost=ts<prBoostUntil,skillActive=(prSkill.checked||ts<prSkillUntil),chaos=ts<prChaosUntil;
  const mul=speed*(boost?1.35:1);
  for(const b of prBalls){
    if(b.done)continue;
    b.vy+=(0.115*(chaos?1.12:1))*mul;
    b.vx*=.996;b.vy*=.999;
    b.x+=b.vx*mul;b.y+=b.vy*mul;
    b.trail.push({x:b.x,y:b.y});if(b.trail.length>8)b.trail.shift();

    if(b.x<45){b.x=45;b.vx=Math.abs(b.vx)*.86}
    if(b.x>935){b.x=935;b.vx=-Math.abs(b.vx)*.86}

    for(const o of prOb){
      if(Math.abs(o.y-b.y)>120)continue;
      if(o.type==='peg'||o.type==='bubble'){
        if(collideCircle(b,o,o.type==='bubble'?1.25:.65) && chaos){b.vx+=prRnd(-1.8,1.8);b.vy+=prRnd(-.8,.6)}
      }else if(o.type==='bar'){
        collideSeg(b,o.x,o.y,o.x2,o.y2)
      }else if(o.type==='spinner'){
        const a=ts*o.speed+o.phase,len=110;
        const x1=o.x-Math.cos(a)*len,y1=o.y-Math.sin(a)*len,x2=o.x+Math.cos(a)*len,y2=o.y+Math.sin(a)*len;
        collideSeg(b,x1,y1,x2,y2)
      }
    }

    // ball skill: periodic shove nearby balls
    b.skillCd-=1;
    if(skillActive && b.skillCd<=0){
      b.skillCd=prRnd(120,240);
      for(const q of prBalls){
        if(q===b||q.done)continue;
        const dx=q.x-b.x,dy=q.y-b.y,d=Math.hypot(dx,dy);
        if(d<90&&d>1){q.vx+=dx/d*prRnd(.8,1.8);q.vy+=dy/d*prRnd(.2,.9)}
      }
    }

    if(b.y>=WORLD_H-90){
      b.done=true;b.finish=prFinishOrder.length+1;prFinishOrder.push(b);
      prEvent(`🏁 ${b.finish}위 골인 · ${b.name}`);
      if(b.finish===1){const c=document.getElementById('prChampion');if(c){c.innerHTML=`🏆 <b>1등 ${escAttr(b.name)}</b><br><small>가장 먼저 골인!</small>`;c.classList.remove('show');void c.offsetWidth;c.classList.add('show')}}
      checkWinner();
    }
  }
  // ball-ball collisions
  for(let i=0;i<prBalls.length;i++)for(let j=i+1;j<prBalls.length;j++){
    const a=prBalls[i],b=prBalls[j];if(a.done||b.done)continue;
    const dx=a.x-b.x,dy=a.y-b.y,d=Math.hypot(dx,dy),rr=a.r+b.r;
    if(d&&d<rr){
      const nx=dx/d,ny=dy/d,over=(rr-d)/2;a.x+=nx*over;b.x-=nx*over;a.y+=ny*over;b.y-=ny*over;
      const rel=(a.vx-b.vx)*nx+(a.vy-b.vy)*ny;
      if(rel<0){a.vx-=rel*nx*.72;a.vy-=rel*ny*.72;b.vx+=rel*nx*.72;b.vy+=rel*ny*.72}
    }
  }
}
function checkWinner(){
  if(prWinnerAnnounced)return;
  const mode=prWinner.value;
  if(mode==='last'){
    if(prFinishOrder.length===prBalls.length && prBalls.length){prWinnerAnnounced=true;prEvent(`🏆 우승: ${prFinishOrder.at(-1).name} · 마지막 골인 규칙`)}
  }else{
    const n=+mode||1;
    if(prFinishOrder.length>=n){prWinnerAnnounced=true;prEvent(`🏆 우승: ${prFinishOrder[n-1].name} · ${n}번째 골인`)}
  }
}
function updateUI(){const wait=document.getElementById('prWaiting');if(wait){const queued=parseParticipants(),n=prRunning?prBalls.filter(b=>!b.done).length:queued.length;wait.firstChild.textContent='';const ready=prRunning?prBalls.filter(b=>!b.done).slice(0,28).map(b=>b.name):queued.slice(0,28);wait.innerHTML=`${prRunning?'레이스 중':'대기 중 공'} <b>${n}개</b><small> · ${prRunning?'현재 코스에서 진행 중':'참가자를 모은 뒤 ▶ 시작을 눌러주세요.'}</small><div id=prReadyList class=pr-ready-list>${ready.map(x=>`<span class=pr-ready-pill>${escAttr(x)}</span>`).join('')}${n>28?`<span class=pr-ready-pill>+${n-28}개</span>`:''}</div><div class=pr-start-note>${prRunning?'진행 중에는 시작 버튼이 잠깁니다.':'공 추가는 대기열에만 들어갑니다. 레이스는 반드시 직접 「▶ 시작」을 눌러야 출발합니다.'}</div>`;}if(window.prStart){prStart.disabled=!!prRunning;prStart.classList.toggle('active-state',prRunning);prStart.textContent=prRunning?'● 레이스 진행 중':'▶ 시작'}
  const live=prBalls.filter(b=>!b.done).length;
  prLive.textContent=live;prFinish.textContent=prFinishOrder.length;
  const leader=prBalls.filter(b=>!b.done).sort((a,b)=>b.y-a.y)[0];
  prLead.textContent=leader?leader.name:'-';

  prProgress.textContent=prog+'%';
  prMapChip.textContent=prMap.options[prMap.selectedIndex].text;
  const prizes=[prPrize1.value.trim(),prPrize2.value.trim(),prPrize3.value.trim()];
  prFinishRows.innerHTML=prFinishOrder.length?prFinishOrder.slice(0,12).map((b,i)=>`<div class=pr-finish-row><span>${i+1}위${i<3&&prizes[i]?` · ${prizes[i]}`:''}</span><strong>${b.name}</strong></div>`).join(''):'아직 골인한 공이 없습니다.';
  if(prFinishOrder.length){
    prResultBox.innerHTML=prFinishOrder.slice(0,3).map((b,i)=>`<div><span class=${i===0?'pr-winner-highlight':''}>${i+1}등 ${b.name}</span>${prizes[i]?` · ${prizes[i]}`:''}</div>`).join('');
  }else{
    prResultBox.textContent='아직 결과가 없습니다.';
  }
}
function draw(ts){
  ctx.clearRect(0,0,980,1500);
  const leader=prBalls.filter(b=>!b.done).sort((a,b)=>b.y-a.y)[0];
  const target=leader?prClamp(leader.y-420,0,WORLD_H-VIEW_H):prClamp(prCamY,0,WORLD_H-VIEW_H);
  prCamY+=(target-prCamY)*.045;

  const bg=ctx.createLinearGradient(0,0,0,1500);bg.addColorStop(0,'#0b2a40');bg.addColorStop(.52,'#061520');bg.addColorStop(1,'#03080d');
  ctx.fillStyle=bg;ctx.fillRect(0,0,980,1500);
  ctx.save();ctx.translate(0,-prCamY);

  // section bands
  for(let y=0;y<WORLD_H;y+=540){
    ctx.fillStyle=(Math.floor(y/540)%2)?'#0a1c2a':'#071622';ctx.fillRect(45,y,890,540);
    ctx.strokeStyle='#1fc7ff22';ctx.strokeRect(45,y,890,540)
  }

  // world walls
  ctx.strokeStyle='#5ae2ff';ctx.lineWidth=8;ctx.shadowBlur=14;ctx.shadowColor='#38d2ff';
  ctx.beginPath();ctx.moveTo(45,0);ctx.lineTo(45,WORLD_H);ctx.moveTo(935,0);ctx.lineTo(935,WORLD_H);ctx.stroke();ctx.shadowBlur=0;

  // obstacles
  for(const o of prOb){
    if(o.y<prCamY-150||o.y>prCamY+VIEW_H+150)continue;
    if(o.type==='peg'||o.type==='bubble'){
      const c=o.type==='bubble'?'#45d8ff':'#ff9a3d';
      ctx.fillStyle='#06131c';ctx.strokeStyle=c;ctx.lineWidth=4;ctx.shadowBlur=12;ctx.shadowColor=c;
      ctx.beginPath();ctx.arc(o.x,o.y,o.r,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.shadowBlur=0;
    }else if(o.type==='bar'){
      ctx.strokeStyle='#a8eaff';ctx.lineWidth=9;ctx.beginPath();ctx.moveTo(o.x,o.y);ctx.lineTo(o.x2,o.y2);ctx.stroke()
    }else if(o.type==='spinner'){
      const a=ts*o.speed+o.phase,len=110;
      ctx.strokeStyle='#ffd84f';ctx.lineWidth=12;ctx.lineCap='round';ctx.shadowBlur=14;ctx.shadowColor='#ffb52f';
      ctx.beginPath();ctx.moveTo(o.x-Math.cos(a)*len,o.y-Math.sin(a)*len);ctx.lineTo(o.x+Math.cos(a)*len,o.y+Math.sin(a)*len);ctx.stroke();ctx.shadowBlur=0;
      ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(o.x,o.y,13,0,Math.PI*2);ctx.fill()
    }
  }

  // finish zone
  ctx.fillStyle='#0b0d10';ctx.fillRect(45,WORLD_H-90,890,90);
  for(let i=0;i<14;i++)for(let j=0;j<2;j++){ctx.fillStyle=(i+j)%2?'#fff':'#111';ctx.fillRect(45+i*64,WORLD_H-90+j*45,64,45)}
  ctx.fillStyle='#ff4e70';ctx.font='900 25px sans-serif';ctx.textAlign='center';ctx.fillText('FINISH',490,WORLD_H-35);

  // balls
  for(const b of prBalls){
    if(b.done)continue;
    b.trail.forEach((p,i)=>{ctx.globalAlpha=(i+1)/b.trail.length*.20;ctx.fillStyle=b.color;ctx.beginPath();ctx.arc(p.x,p.y,4,0,7);ctx.fill()});
    ctx.globalAlpha=1;ctx.fillStyle=b.color;ctx.shadowBlur=15;ctx.shadowColor=b.color;ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,7);ctx.fill();ctx.shadowBlur=0;
    ctx.font='800 9px sans-serif';ctx.fillStyle='#fff';ctx.textAlign='center';ctx.fillText(b.name,b.x,b.y-18)
  }
  ctx.restore();
}
function loop(ts){
  if(!prRunning)return;
  const dt=Math.min(32,ts-(prLast||ts));prLast=ts;
  physics(ts,dt);draw(ts);updateUI();
  if(prBalls.length && prFinishOrder.length===prBalls.length){prRunning=false;draw(ts);updateUI();return}
  prRAF=requestAnimationFrame(loop)
}
function startPinRace(){
  if(prRunning){prEvent('이미 레이스가 진행 중입니다.');return}
  const names=parseParticipants();
  if(!names.length){prEvent('참가자를 한 명 이상 입력하세요.');updateUI();return}
  cancelAnimationFrame(prRAF);prBalls=[];prFinishOrder=[];prWinnerAnnounced=false;prCamY=0;prNextId=1;
  buildMap(prMap.value);
  names.forEach((n,i)=>spawnBall(n,150+(i%10)*72+prRnd(-15,15),80+Math.floor(i/10)*34));
  prRunning=true;prLast=0;prEvent(`🚦 ${prBalls.length}개 공 출발! · 카메라가 선두를 따라갑니다.`);updateUI();draw(performance.now());prRAF=requestAnimationFrame(loop)
}
function stopRace(){if(!prRunning)return;prRunning=false;cancelAnimationFrame(prRAF);prEvent('■ 일시 정지 · ▶ 시작을 누르면 현재 레이스를 이어서 진행합니다.');updateUI()}
function resetRace(){prRunning=false;cancelAnimationFrame(prRAF);prBalls=[];prFinishOrder=[];prWinnerAnnounced=false;prCamY=0;loadPinMeta();buildMap(prMap.value);draw(performance.now());updateUI();prEvent('↻ 초기화 완료')}
function shuffleBalls(){
  for(const b of prBalls){if(b.done)continue;b.vx+=prRnd(-4.5,4.5);b.vy+=prRnd(-2.5,1.5)}
  prEvent('🔀 전체 공을 섞었습니다.')
}
function applyPinEffect(effect,value=1,source='테스트'){
  value=Math.max(1,+value||1);
  if(effect==='add_ball'){
    if(!prRunning){const lines=prNames.value.split(/\n+/).map(x=>x.trim()).filter(Boolean);for(let i=0;i<value;i++)lines.push(prLastDonorName||`후원공${i+1}`);prNames.value=lines.join('\n');savePinMeta()}
    else for(let i=0;i<value;i++)spawnBall(prLastDonorName||`후원공${prNextId}`,prRnd(150,830),Math.max(70,prCamY+80));
    prEvent(`🎈 ${source} · 공 ${value}개 ${prRunning?'추가':'대기열 추가'}`)
  }else if(effect==='shuffle'){shuffleBalls();prEvent(`🎈 ${source} · 전체 공 섞기`)}
  else if(effect==='boost'){prBoostUntil=performance.now()+value*1000;prEvent(`⚡ ${source} · 가속 ${value}초`)}
  else if(effect==='skill'){prSkillUntil=performance.now()+value*1000;prEvent(`💥 ${source} · 밀치기 스킬 ${value}초`)}
  else if(effect==='rain'){
    if(!prRunning){const lines=prNames.value.split(/\n+/).map(x=>x.trim()).filter(Boolean);for(let i=0;i<value;i++)lines.push(prLastDonorName||`레인공${lines.length+1}`);prNames.value=lines.slice(0,120).join('\n');savePinMeta();prEvent(`🌧️ ${source} · 추가 공 ${value}개 대기열 추가`)}
    else{for(let i=0;i<value;i++)spawnBall(prLastDonorName||`레인${prNextId}`,prRnd(120,860),Math.max(60,prCamY+20));prEvent(`🌧️ ${source} · 추가 공 ${value}개`)}
  }else if(effect==='chaos'){prChaosUntil=performance.now()+value*1000;prEvent(`🌀 ${source} · 카오스 ${value}초`)}
  updateUI();return 1
}
window.SOOP_PINBALL_BALLOON=function(count,donorName=''){
  count=Math.max(0,+count||0);prLastDonorName=(donorName||'').trim();
  const matched=pinRules.filter(r=>r.count===count);
  if(!matched.length){prEvent(`🎈 ${prLastDonorName?prLastDonorName+' · ':''}별풍선 ${count}개 수신 · 등록된 핀볼 효과 없음`);return 0}
  matched.forEach((r,idx)=>setTimeout(()=>{
    const source=`${prLastDonorName?prLastDonorName+' · ':''}별풍선 ${count}개`;
    if(!prRunning&&(r.effect==='add_ball'||r.effect==='rain')){
      const n=Math.max(1,+r.value||1),lines=prNames.value.split(/\n+/).map(x=>x.trim()).filter(Boolean);
      for(let k=0;k<n;k++)lines.push(prLastDonorName||`후원공${lines.length+1}`);
      prNames.value=lines.slice(0,120).join('\n');savePinMeta();prEvent(`🎈 ${source} · 공 ${n}개 대기열 추가 · 시작 대기`);updateUI();return;
    }
    applyPinEffect(r.effect,r.value,source)
  },idx*180));
  return matched.length
};

function renderRules(){
  prRuleList.innerHTML=pinRules.map((r,i)=>`<div class=pr-rule>

const ttC=ttCanvas.getContext('2d'),ttN=ttNext.getContext('2d'),TTW=10,TTH=20;

function ttEmpty(){return Array.from({length:TTH},()=>Array(TTW).fill(''))}
function ttRandPiece(){const k=Object.keys(ttShapes),type=k[Math.floor(Math.random()*k.length)];return{type,shape:ttShapes[type].map(r=>r.slice())}}
function ttRotate(sh){return sh[0].map((_,i)=>sh.map(r=>r[i]).reverse())}
function ttCollision(sh,x,y){for(let r=0;r<sh.length;r++)for(let c=0;c<sh[r].length;c++)if(sh[r][c]){const nx=x+c,ny=y+r;if(nx<0||nx>=TTW||ny>=TTH)return true;if(ny>=0&&ttBoard[ny][nx])return true}return false}
function ttSpawn(){ttPiece=ttNextPiece||ttRandPiece();ttNextPiece=ttRandPiece();ttX=Math.floor((TTW-ttPiece.shape[0].length)/2);ttY=-1;if(ttCollision(ttPiece.shape,ttX,ttY)){ttGameOver();return}ttDrawNext()}
function ttMerge(){for(let r=0;r<ttPiece.shape.length;r++)for(let c=0;c<ttPiece.shape[r].length;c++)if(ttPiece.shape[r][c]){const y=ttY+r;if(y>=0)ttBoard[y][ttX+c]=ttPiece.type}}
function ttClearLines(){let cleared=0;for(let y=TTH-1;y>=0;y--)if(ttBoard[y].every(Boolean)){ttBoard.splice(y,1);ttBoard.unshift(Array(TTW).fill(''));cleared++;y++}if(cleared){const pts=[0,100,300,500,800][cleared]||1000;ttScoreV+=pts*ttLevelV;ttLinesV+=cleared;ttLevelV=Math.max(+ttLevel.value||1,Math.floor(ttLinesV/10)+(+ttLevel.value||1));ttEvent.textContent=`✨ ${cleared}줄 삭제 · +${pts*ttLevelV}점`}}
function ttDrop(){if(!ttPiece)return;if(!ttCollision(ttPiece.shape,ttX,ttY+1))ttY++;else{ttMerge();ttClearLines();ttSpawn()}}
function ttHard(){let n=0;while(!ttCollision(ttPiece.shape,ttX,ttY+1)){ttY++;n++}ttScoreV+=n*2;ttDrop()}
function ttMove(dx){if(ttPiece&&!ttCollision(ttPiece.shape,ttX+dx,ttY))ttX+=dx}
function ttTurn(){if(!ttPiece)return;const r=ttRotate(ttPiece.shape);if(!ttCollision(r,ttX,ttY))ttPiece.shape=r;else if(!ttCollision(r,ttX-1,ttY)){ttX--;ttPiece.shape=r}else if(!ttCollision(r,ttX+1,ttY)){ttX++;ttPiece.shape=r}}
function ttDrawBlock(c,x,y,color,size=30){c.fillStyle=color;c.fillRect(x+1,y+1,size-2,size-2);c.fillStyle='#ffffff28';c.fillRect(x+3,y+3,size-6,4);c.strokeStyle='#00000055';c.strokeRect(x+1,y+1,size-2,size-2)}
function ttDraw(){ttC.clearRect(0,0,300,600);ttC.fillStyle='#06111a';ttC.fillRect(0,0,300,600);ttC.strokeStyle='#ffffff0b';for(let x=0;x<=300;x+=30){ttC.beginPath();ttC.moveTo(x,0);ttC.lineTo(x,600);ttC.stroke()}for(let y=0;y<=600;y+=30){ttC.beginPath();ttC.moveTo(0,y);ttC.lineTo(300,y);ttC.stroke()}for(let y=0;y<TTH;y++)for(let x=0;x<TTW;x++)if(ttBoard[y][x])ttDrawBlock(ttC,x*30,y*30,ttColors[ttBoard[y][x]]);if(ttPiece)for(let r=0;r<ttPiece.shape.length;r++)for(let c=0;c<ttPiece.shape[r].length;c++)if(ttPiece.shape[r][c]&&ttY+r>=0)ttDrawBlock(ttC,(ttX+c)*30,(ttY+r)*30,ttColors[ttPiece.type]);ttScore.textContent=ttScoreV.toLocaleString();ttLines.textContent=ttLinesV;ttLevelView.textContent=ttLevelV;ttStars.textContent=ttStarsV.toLocaleString()}
function ttDrawNext(){ttN.clearRect(0,0,100,100);ttN.fillStyle='#030b11';ttN.fillRect(0,0,100,100);if(!ttNextPiece)return;const sh=ttNextPiece.shape,sz=20,w=sh[0].length*sz,h=sh.length*sz,ox=(100-w)/2,oy=(100-h)/2;for(let r=0;r<sh.length;r++)for(let c=0;c<sh[r].length;c++)if(sh[r][c])ttDrawBlock(ttN,ox+c*sz,oy+r*sz,ttColors[ttNextPiece.type],sz)}
function ttInterval(ts){const base=Math.max(90,720-(ttLevelV-1)*55);return ts<ttSpeedUntil?Math.max(30,base*.12):base}
function ttLoop(ts){if(!ttRunning)return;if(!ttPaused&&!ttOver&&ts-ttLastDrop>ttInterval(ts)){ttDrop();ttLastDrop=ts}ttDraw();ttRAF=requestAnimationFrame(ttLoop)}
function ttStartGame(){cancelAnimationFrame(ttRAF);ttBoard=ttEmpty();ttScoreV=0;ttLinesV=0;ttStarsV=0;ttLevelV=+ttLevel.value||1;ttNextPiece=ttRandPiece();ttRunning=true;ttPaused=false;ttOver=false;ttLastDrop=0;ttSpeedUntil=0;ttCanvas.classList.remove('tt-speed-active','tt-scramble-active','tt-bomb-active');ttSpawn();ttEvent.textContent=ttMode==='api'?'🎈 API 아이템전 시작 · 실제 별풍선 수신 대기':'🎮 일반 노템전 시작 · 순수 점수 경쟁';ttRAF=requestAnimationFrame(ttLoop)}

function ttAddGarbage(n){n=Math.min(6,Math.max(1,+n||1));for(let k=0;k<n;k++){ttBoard.shift();const hole=Math.floor(Math.random()*TTW);ttBoard.push(Array.from({length:TTW},(_,i)=>i===hole?'':'G'))}}
function ttRemoveBottom(n){n=Math.min(6,Math.max(1,+n||1));for(let k=0;k<n;k++){ttBoard.pop();ttBoard.unshift(Array(TTW).fill(''))}}
function ttScrambleInstalled(){const cells=[];for(let y=0;y<TTH;y++)for(let x=0;x<TTW;x++)if(ttBoard[y][x])cells.push(ttBoard[y][x]);ttBoard=ttEmpty();const spots=[];for(let y=4;y<TTH;y++)for(let x=0;x<TTW;x++)spots.push([x,y]);for(let i=spots.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[spots[i],spots[j]]=[spots[j],spots[i]]}cells.forEach((type,i)=>{if(spots[i]){const [x,y]=spots[i];ttBoard[y][x]=type}});if(ttPiece){ttY=-1;ttX=Math.floor((TTW-ttPiece.shape[0].length)/2)}ttCanvas.classList.remove('tt-scramble-active');void ttCanvas.offsetWidth;ttCanvas.classList.add('tt-scramble-active');setTimeout(()=>ttCanvas.classList.remove('tt-scramble-active'),650)}
function ttBombDebris(n=10){n=Math.min(24,Math.max(4,+n||10));const spots=[];for(let y=8;y<=14;y++)for(let x=2;x<=7;x++){const d=Math.hypot(x-4.5,(y-11)*.78);if(d<3.2)spots.push([x,y])}for(let i=spots.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[spots[i],spots[j]]=[spots[j],spots[i]]}for(let i=0;i<Math.min(n,spots.length);i++){const [x,y]=spots[i];ttBoard[y][x]='G'}if(ttPiece&&ttCollision(ttPiece.shape,ttX,ttY)){ttY=-1;ttX=Math.floor((TTW-ttPiece.shape[0].length)/2)}ttCanvas.classList.remove('tt-bomb-active');void ttCanvas.offsetWidth;ttCanvas.classList.add('tt-bomb-active');setTimeout(()=>ttCanvas.classList.remove('tt-bomb-active'),850)}
function ttApplyEffect(effect,value=1,source='TEST'){value=Math.max(1,+value||1);if(effect==='garbage'){ttAddGarbage(value);ttEvent.textContent=`🧱 ${source} · 방해 줄 ${value}개`}else if(effect==='clear'){ttRemoveBottom(value);ttEvent.textContent=`🧹 ${source} · 아래 줄 ${value}개 삭제`}else if(effect==='speed'){ttSpeedUntil=performance.now()+value*1000;ttLastDrop=0;ttCanvas.classList.add('tt-speed-active');setTimeout(()=>{if(performance.now()>=ttSpeedUntil-30)ttCanvas.classList.remove('tt-speed-active')},value*1000+80);ttEvent.textContent=`⚡ ${source} · 초고속 낙하 ${value}초`}else if(effect==='reroll'){ttPiece=ttRandPiece();ttX=Math.floor((TTW-ttPiece.shape[0].length)/2);ttY=0;ttNextPiece=ttRandPiece();ttDrawNext();ttEvent.textContent=`🎲 ${source} · 블록 재추첨`}else if(effect==='scramble'){ttScrambleInstalled();ttEvent.textContent=`🔀 ${source} · 설치된 블록 위치 랜덤 섞기`}else if(effect==='bomb'){ttBombDebris(value);ttEvent.textContent=`💣 ${source} · 중앙 폭발! 잔해 ${Math.max(4,value)}개 생성`}ttDraw();return 1}
window.SOOP_TETRIS_BALLOON=function(count,donor=''){count=Math.max(0,+count||0);if(ttMode!=='api')return 0;ttStarsV+=count;const matched=ttRules.filter(r=>r.count===count);if(!matched.length){ttEvent.textContent=`🎈 ${donor?donor+' · ':''}${count}개 수신 · 누적 ${ttStarsV.toLocaleString()}개 · 등록 효과 없음`;ttDraw();return 0}matched.forEach((r,i)=>setTimeout(()=>ttApplyEffect(r.effect,r.value,`🎈 ${donor?donor+' · ':''}${count}개`),i*180));ttDraw();return matched.length};

// REV11 actual SOOP donation reception. Local browser keeps manual test buttons.
let soopExt=null;
function setSoopStatus(text,type='warn'){let el=document.getElementById('globalSoopStatus');if(!el)return;el.textContent=text;el.className='soop-live-status '+type}
function currentActiveGameId(){const p=document.querySelector('main .panel.on');return p?p.id:''}
function routeSoopBalloon(count,donor='SOOP 후원자',messageText=''){
  count=Number(count)||0;if(count<=0)return 0;
  const game=currentActiveGameId();let times=0,label='효과 없음';

function processSOOPChat(action,message){if(action==='BALLOON_GIFTED'){const txt=(message&&(message.message||message.comment||message.text||message.chatMessage||message.memo))||'';routeSoopBalloon(message&&message.count,(message&&message.userNickname)||'SOOP 후원자',txt)}else if(action==='BATTLE_MISSION_GIFTED')setSoopStatus(`🎯 배틀미션 후원 수신 · ${(message&&message.userNickname)||'시청자'}`,'ok')}

// ===== V18 reusable BGM manager: per-user YouTube URL + volume persistence =====
const SOOP_BGM_OWNER=(()=>{const q=new URLSearchParams(location.search);return (q.get('player')||'local').trim()||'local'})();
const gameBgm={};
function bgmStoreKey(game){return `soop_bgm_v2:${SOOP_BGM_OWNER}:${game}`}
function bgmLoadCfg(game){try{return JSON.parse(localStorage.getItem(bgmStoreKey(game))||'{}')||{}}catch(e){return{}}}
function bgmSaveCfg(game,cfg){try{localStorage.setItem(bgmStoreKey(game),JSON.stringify(cfg))}catch(e){}}
function bgmYoutubeInfo(raw){
  const u=String(raw||'').trim();let id='',start=0;
  let m=u.match(/(?:v=|youtu\.be\/|shorts\/|embed\/)([A-Za-z0-9_-]{6,})/);if(m)id=m[1];
  let tm=u.match(/[?&#](?:t|start)=([^&#]+)/);if(tm){let v=decodeURIComponent(tm[1]);if(/^\d+$/.test(v))start=+v;else{let h=+(v.match(/(\d+)h/)||[,0])[1],mi=+(v.match(/(\d+)m/)||[,0])[1],se=+(v.match(/(\d+)s/)||[,0])[1];start=h*3600+mi*60+se}}
  return{id,start:Math.max(0,start|0)};
}
function bgmCmd(game,func,arg){const st=gameBgm[game],f=st&&st.frame;if(!f||!f.contentWindow)return;try{f.contentWindow.postMessage(JSON.stringify({event:'command',func,args:arg==null?[]:[arg]}),'*')}catch(e){}}
function bgmStatus(game,text,playing=false){const st=gameBgm[game];if(!st)return;st.status.textContent=text;st.status.classList.toggle('playing',!!playing)}
function bgmPause(game){const st=gameBgm[game];if(!st)return;if(st.audio&&!st.audio.paused)st.audio.pause();bgmCmd(game,'pauseVideo');bgmStatus(game,'● 정지/대기',false)}
function bgmPlay(game){const st=gameBgm[game];if(!st)return;
  if(st.audio&&st.audio.src){st.audio.play().then(()=>bgmStatus(game,'● 재생 중',true)).catch(()=>bgmStatus(game,'재생 버튼을 다시 눌러주세요',false));return}
  if(st.ytLoaded){bgmCmd(game,'setVolume',Math.round((+st.vol.value||45)));bgmCmd(game,'playVideo');bgmStatus(game,'● YouTube 재생 중',true);return}
  if(st.url.value.trim()){bgmLoadYoutube(game,false);setTimeout(()=>bgmPlay(game),850);return}
  bgmStatus(game,'음원 또는 YouTube 주소를 등록하세요',false)
}
function bgmLoadYoutube(game,autoplay=false){const st=gameBgm[game];if(!st)return false;const info=bgmYoutubeInfo(st.url.value);if(!info.id){bgmStatus(game,'YouTube 주소를 확인해 주세요',false);return false}
  if(st.audio&&!st.audio.paused)st.audio.pause();const cfg={url:st.url.value.trim(),volume:+st.vol.value||45};bgmSaveCfg(game,cfg);
  st.frame.src=`https://www.youtube.com/embed/${info.id}?enablejsapi=1&playsinline=1&loop=1&playlist=${info.id}${info.start?`&start=${info.start}`:''}`;st.ytLoaded=true;bgmStatus(game,'YouTube 불러옴 · 재생 버튼을 누르세요',false);if(autoplay)setTimeout(()=>bgmPlay(game),850);return true
}
function initGameBgm(game,panel,label){if(!panel||gameBgm[game])return;const cfg=bgmLoadCfg(game),box=document.createElement('div');box.className='game-bgm-box';box.innerHTML=`<div class=game-bgm-head><strong>🎵 ${label||'BGM'}</strong><span class=game-bgm-status>● 준비됨</span></div><div class=game-bgm-row><input class=game-bgm-url type=text placeholder="YouTube 주소를 붙여넣으세요"><button class="btn game-bgm-load">주소 저장/불러오기</button><button class="btn primary game-bgm-play">▶ 재생 / 정지</button><label>볼륨 <input class=game-bgm-vol type=range min=0 max=100 value="45"></label></div><div class=game-bgm-row style="margin-top:6px"><input class=game-bgm-file type=file accept="audio/*"><span class=muted>내 음원 파일 선택</span></div><small class=game-bgm-note>YouTube 주소와 볼륨은 현재 사용자(${escAttr(SOOP_BGM_OWNER)}) 기준으로 저장됩니다. 로컬 음원 파일은 브라우저 보안상 다음 실행 때 자동 복원되지 않습니다.</small><iframe class=game-bgm-yt allow="autoplay"></iframe>`;
  const anchor=panel.querySelector('.settings,.pr-side,.tt-left')||panel.firstElementChild; if(anchor)anchor.appendChild(box); else panel.prepend(box);
  const st=gameBgm[game]={box,status:box.querySelector('.game-bgm-status'),url:box.querySelector('.game-bgm-url'),vol:box.querySelector('.game-bgm-vol'),file:box.querySelector('.game-bgm-file'),frame:box.querySelector('.game-bgm-yt'),audio:new Audio(),ytLoaded:false};st.audio.loop=true;st.url.value=cfg.url||'';st.vol.value=Number.isFinite(+cfg.volume)?+cfg.volume:45;st.audio.volume=(+st.vol.value||45)/100;
  box.querySelector('.game-bgm-load').onclick=()=>bgmLoadYoutube(game,false);
  box.querySelector('.game-bgm-play').onclick=()=>{const playing=(st.audio.src&&!st.audio.paused)||st.status.classList.contains('playing');playing?bgmPause(game):bgmPlay(game)};
  st.url.addEventListener('change',()=>bgmSaveCfg(game,{url:st.url.value.trim(),volume:+st.vol.value||45}));
  st.vol.oninput=()=>{const v=(+st.vol.value||0)/100;st.audio.volume=v;bgmCmd(game,'setVolume',Math.round(v*100));bgmSaveCfg(game,{url:st.url.value.trim(),volume:+st.vol.value||45})};
  st.file.onchange=()=>{const f=st.file.files&&st.file.files[0];if(!f)return;bgmCmd(game,'pauseVideo');st.ytLoaded=false;if(st.audio.src&&st.audio.src.startsWith('blob:'))URL.revokeObjectURL(st.audio.src);st.audio.src=URL.createObjectURL(f);st.audio.volume=(+st.vol.value||45)/100;bgmStatus(game,`파일 준비됨 · ${f.name}`,false)};
  if(st.url.value)bgmStatus(game,'저장된 YouTube 주소 있음',false)
}

  initGameBgm('roulette',document.getElementById('roulette'),'룰렛 BGM');
  initGameBgm('tetris',document.getElementById('tetris'),'테트리스 BGM');

}
